name: Deploy DinuStream

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}

          script: |
            set -e

            echo "================================"
            echo "DinuStream deployment started"
            echo "================================"

            cd /opt/dinustream/frontend

            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci

            echo "Building DinuStream..."
            npm run build

            echo "Restarting DinuStream..."
            sudo systemctl restart dinustream-web

            echo "Checking service..."
            sudo systemctl is-active --quiet dinustream-web

            echo "================================"
            echo "DinuStream deployment successful"
            echo "================================"
